server {
    # Cloud Run injects $PORT (8080 by default) and expects the container
    # to listen on it. If you deploy with a custom --port, update this to match.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static text assets for faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # CSS/JS have no cache-busting filenames (no build step/fingerprinting),
    # so a long cache here means a redeploy can leave visitors on stale,
    # mismatched assets (new HTML markup + old CSS = broken layout). Force
    # revalidation on every load instead — nginx still answers with 304 (no
    # body) when the file hasn't changed, so this costs a round trip, not a
    # re-download.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Heavy, rarely-changing binary assets can stay long-cached.
    location ~* \.(?:mp4|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
