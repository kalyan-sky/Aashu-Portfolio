server {
    # Cloud Run injects $PORT (8080 by default) and expects the container
    # to listen on it. If you deploy with a custom --port, update this to match.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip static text assets for faster loads
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Long-cache fingerprint-free static assets; HTML stays revalidated.
    location ~* \.(?:css|js|mp4|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
